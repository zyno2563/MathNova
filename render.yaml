# Render.com blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mathnova
    runtime: python
    # Free instances get 512 MB RAM and 0.1 CPU, and spin down after
    # ~15 minutes of inactivity (the next request then pays a cold
    # start). Change to `starter` for an always-on instance.
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on the free plan: two would contend for a tenth of a
    # CPU and roughly double the resident memory for no throughput.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Memory each calculation may use on top of what the worker already
      # holds (~65 MB warm). Worker + allowance must fit the instance's
      # 512 MB, or the container is OOM-killed before the cap can act.
      - key: MATHNOVA_COMPUTE_MEMORY_MB
        value: "256"
      # Set the values in the Render dashboard, not here. Groq answers
      # first; Gemini takes over when Groq's free allowance is spent.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MATHNOVA_AI_PROVIDER
        value: auto
