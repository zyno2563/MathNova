<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solver &#8212; MathNova</title>
  <meta name="description" content="Solve transforms, ODEs, PDEs, calculus, linear algebra and numerical methods problems, with every result independently verified." />

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
          integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-page="solver">

<div class="shell">

  <nav class="sidebar" id="sidebar" aria-label="Site navigation">
    <div id="site-nav"></div>
    <hr class="nav-divider" />
    <p class="nav-heading">Modules</p>
    <ul class="module-list" id="module-list"></ul>
    <footer class="sidebar-foot">
      <a href="/api/docs" target="_blank" rel="noopener">API reference &#8599;</a>
    </footer>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <section class="module-head">
      <h1 id="module-title">MathNova</h1>
      <p id="module-blurb" class="blurb"></p>
    </section>

    <div id="method-tabs" class="tabs" role="tablist"></div>

    <section class="panel" id="form-panel">
      <div id="method-formula" class="formula" hidden></div>
      <form id="method-form" class="form" autocomplete="off" novalidate></form>
      <div class="form-actions">
        <button type="submit" form="method-form" class="button primary" id="submit-button">Compute</button>
        <button type="button" class="button ghost" id="example-button">Load example</button>
        <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
      </div>
      <p class="example-note" id="example-note" hidden aria-live="polite"></p>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
